name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Avalanche.sln

      - name: Build
        run: dotnet build Avalanche.sln -c Release --no-restore

      - name: Test Engine
        run: dotnet test engine/Avalanche.Engine.Tests/Avalanche.Engine.Tests.csproj -c Release --no-restore

      - name: Test App
        run: dotnet test Avalanche.Tests/Avalanche.Tests.csproj -c Release --no-restore

      - name: Build Portable
        shell: pwsh
        run: |
          ./build/build-portable.ps1 -PackageKind Portable

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Avalanche-Portable
          path: bin/Release/net10.0-windows/publish/Avalanche-Portable.exe
          if-no-files-found: error

      - name: Build Installer
        shell: pwsh
        run: |
          ./build/build-portable.ps1 -PackageKind Installer

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Avalanche-Installer
          path: bin/Release/net10.0-windows/publish/Avalanche.exe
          if-no-files-found: error